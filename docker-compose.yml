services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      - PORT=3001
      - DB_PATH=/app/data/fintrack.db
    volumes:
      - sqlite_data:/app/data

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  sqlite_data:
